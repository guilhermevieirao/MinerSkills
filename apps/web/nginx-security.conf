# ─────────────────────────────────────────────────────────────
#  Cabeçalhos de segurança — MinerSkills
#
#  IMPORTANTE: no nginx, os `add_header` de um nível são HERDADOS apenas se
#  o nível atual NÃO declarar nenhum `add_header`. Como alguns `location`
#  precisam do seu próprio Cache-Control, este arquivo é incluído em CADA um
#  deles para garantir que os cabeçalhos nunca sejam perdidos.
# ─────────────────────────────────────────────────────────────
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "SAMEORIGIN" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;

# CSP: fontes são self-hosted; embeds apenas do youtube-nocookie;
# miniaturas dos vídeos vêm de i.ytimg.com.
add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https://i.ytimg.com; media-src 'self' blob:; font-src 'self'; connect-src 'self'; frame-src https://www.youtube-nocookie.com https://www.youtube.com; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'self'" always;
