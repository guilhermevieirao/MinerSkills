# ─────────────────────────────────────────────────────────────
#  MinerSkills — diretivas de contexto `http` (carregadas ANTES do
#  default.conf: o Dockerfile copia este arquivo para
#  /etc/nginx/conf.d/00-map.conf e o nginx inclui conf.d/*.conf em
#  ordem alfabética).
#
#  `map` e `upstream` só podem viver no contexto http, por isso não
#  ficam no nginx.conf (que é um bloco `server`).
# ─────────────────────────────────────────────────────────────

# Bots de PRÉ-VISUALIZAÇÃO de links (WhatsApp, Facebook, X, LinkedIn, Discord,
# Telegram, Slack). Eles não executam JavaScript, então o SPA lhes mostraria
# só o index.html genérico; para /blog/:slug e /equipe/:slug o nginx entrega
# a eles o HTML de pré-visualização da API (/og/*), com as metatags reais.
#
# Googlebot e outros buscadores NÃO entram aqui de propósito: servir a um
# buscador um HTML diferente do que o visitante vê é cloaking e pode
# penalizar o site. Buscadores executam o SPA e leem o head montado pelo
# useDocumentHead.
map $http_user_agent $ms_preview_bot {
    default 0;
    ~*(facebookexternalhit|WhatsApp|Twitterbot|LinkedInBot|Discordbot|TelegramBot|Slackbot) 1;
}

# Grupo nomeado da API: um `proxy_pass` com variável (o de /og$request_uri)
# resolve o host em runtime e exigiria um `resolver`; com o upstream nomeado
# o nome é resolvido no boot, como nos demais `proxy_pass http://api:3001`.
upstream minerskills_api {
    server api:3001;
}

# Esquema visto pelo cliente. Atrás do Caddy (TLS na borda) a conexão com o
# nginx é sempre http, mas o Caddy informa o esquema real em
# X-Forwarded-Proto; sem proxy à frente, vale o esquema desta conexão.
map $http_x_forwarded_proto $ms_forwarded_proto {
    default $scheme;
    https   https;
    http    http;
}
