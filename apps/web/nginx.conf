# ─────────────────────────────────────────────────────────────
#  MinerSkills — nginx (produção)
#  Serve o SPA buildado e faz proxy de /api e /uploads para a API.
#  Em produção fica atrás do Caddy (TLS, HSTS, redirect http→https —
#  ver Caddyfile): por isso X-Forwarded-Proto repassa o esquema que o
#  cliente usou ($ms_forwarded_proto, nginx-map.conf), não o desta
#  conexão interna, que é sempre http.
#  sitemap.xml, robots.txt e /og/* também vêm da API (SEO), e as
#  páginas /blog/:slug e /equipe/:slug são entregues como HTML de
#  pré-visualização aos bots sociais (ver nginx-map.conf e docs/seo.md).
#
#  Nota sobre `add_header`: o nginx só herda os add_header de níveis
#  superiores quando o nível atual não declara nenhum. Por isso os
#  cabeçalhos de segurança vêm de um snippet incluído em cada location.
# ─────────────────────────────────────────────────────────────
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    server_tokens off;

    # ─── Compressão ───────────────────────────────────────────
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_types
        text/plain text/css text/xml application/json application/javascript
        application/xml application/xml+rss application/atom+xml image/svg+xml
        application/manifest+json;

    client_max_body_size 100M;

    include /etc/nginx/snippets/minerskills-security.conf;

    # ─── API ──────────────────────────────────────────────────
    location /api/ {
        include /etc/nginx/snippets/minerskills-security.conf;
        proxy_pass http://api:3001;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $ms_forwarded_proto;
        proxy_read_timeout 120s;
    }

    # ─── Uploads (a API define seus próprios cabeçalhos de cache) ──
    location /uploads/ {
        include /etc/nginx/snippets/minerskills-security.conf;
        proxy_pass http://api:3001;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $ms_forwarded_proto;
    }

    # ─── SEO: sitemap, robots e pré-visualização OG vêm da API ────
    # (a API monta essas rotas na raiz, fora de /api; cache definido por ela)
    location = /sitemap.xml {
        include /etc/nginx/snippets/minerskills-security.conf;
        proxy_pass http://api:3001;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $ms_forwarded_proto;
    }

    location = /robots.txt {
        include /etc/nginx/snippets/minerskills-security.conf;
        proxy_pass http://api:3001;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $ms_forwarded_proto;
    }

    # /og/blog/:slug e /og/equipe/:slug acessíveis diretamente (útil para
    # conferir o que um bot vai ver); a API responde com X-Robots-Tag: noindex.
    location /og/ {
        include /etc/nginx/snippets/minerskills-security.conf;
        proxy_pass http://api:3001;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $ms_forwarded_proto;
    }

    # ─── Páginas com pré-visualização para bots sociais ───────
    # Bots de pré-visualização de links (WhatsApp, Facebook, X, LinkedIn,
    # Discord, Telegram, Slack — `$ms_preview_bot`, definido em nginx-map.conf)
    # não executam JavaScript: para eles /blog/:slug e /equipe/:slug são
    # respondidos pela API em /og/<mesma URL>, um HTML só com as metatags
    # reais do conteúdo. Todo o resto (pessoas e buscadores) recebe o SPA.
    #
    # Googlebot NUNCA entra nessa lista: mostrar a um buscador um HTML
    # diferente do que o visitante vê é cloaking. Buscadores executam o SPA
    # e leem o head montado por useDocumentHead.
    #
    # `if` + `proxy_pass` é uma das combinações seguras do nginx ("if is
    # evil" vale para diretivas que não são de conteúdo). O `try_files` do
    # location não é herdado pelo bloco `if`, então o bot nunca cai no SPA.
    location ~ ^/(blog|equipe)/[^/]+$ {
        include /etc/nginx/snippets/minerskills-security.conf;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $ms_forwarded_proto;
        # o add_header abaixo vale também para a resposta proxiada; esconder o
        # Cache-Control da API evita dois cabeçalhos Cache-Control na resposta
        proxy_hide_header Cache-Control;
        if ($ms_preview_bot) {
            # upstream nomeado (nginx-map.conf): proxy_pass com variável
            # exige nome resolvido no boot ou um `resolver`
            proxy_pass http://minerskills_api/og$request_uri;
        }
        add_header Cache-Control "no-cache" always;
        try_files $uri /index.html;
    }

    # ─── Assets com hash: cache imutável ──────────────────────
    location /assets/ {
        include /etc/nginx/snippets/minerskills-security.conf;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        try_files $uri =404;
    }

    # ─── Service worker: nunca cachear ────────────────────────
    location = /sw.js {
        include /etc/nginx/snippets/minerskills-security.conf;
        add_header Cache-Control "no-store, must-revalidate" always;
        try_files $uri =404;
    }

    location = /manifest.webmanifest {
        include /etc/nginx/snippets/minerskills-security.conf;
        add_header Cache-Control "no-cache" always;
        try_files $uri =404;
    }

    # ─── SPA fallback ─────────────────────────────────────────
    location / {
        include /etc/nginx/snippets/minerskills-security.conf;
        add_header Cache-Control "no-cache" always;
        try_files $uri $uri/ /index.html;
    }
}
