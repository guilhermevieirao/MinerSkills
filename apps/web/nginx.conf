# ─────────────────────────────────────────────────────────────
#  MinerSkills — nginx (produção)
#  Serve o SPA buildado e faz proxy de /api e /uploads para a API.
#
#  Nota sobre `add_header`: o nginx só herda os add_header de níveis
#  superiores quando o nível atual não declara nenhum. Por isso os
#  cabeçalhos de segurança vêm de um snippet incluído em cada location.
# ─────────────────────────────────────────────────────────────
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    server_tokens off;

    # ─── Compressão ───────────────────────────────────────────
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_types
        text/plain text/css text/xml application/json application/javascript
        application/xml+rss application/atom+xml image/svg+xml
        application/manifest+json;

    client_max_body_size 100M;

    include /etc/nginx/snippets/minerskills-security.conf;

    # ─── API ──────────────────────────────────────────────────
    location /api/ {
        include /etc/nginx/snippets/minerskills-security.conf;
        proxy_pass http://api:3001;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }

    # ─── Uploads (a API define seus próprios cabeçalhos de cache) ──
    location /uploads/ {
        include /etc/nginx/snippets/minerskills-security.conf;
        proxy_pass http://api:3001;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # ─── Assets com hash: cache imutável ──────────────────────
    location /assets/ {
        include /etc/nginx/snippets/minerskills-security.conf;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        try_files $uri =404;
    }

    # ─── Service worker: nunca cachear ────────────────────────
    location = /sw.js {
        include /etc/nginx/snippets/minerskills-security.conf;
        add_header Cache-Control "no-store, must-revalidate" always;
        try_files $uri =404;
    }

    location = /manifest.webmanifest {
        include /etc/nginx/snippets/minerskills-security.conf;
        add_header Cache-Control "no-cache" always;
        try_files $uri =404;
    }

    # ─── SPA fallback ─────────────────────────────────────────
    location / {
        include /etc/nginx/snippets/minerskills-security.conf;
        add_header Cache-Control "no-cache" always;
        try_files $uri $uri/ /index.html;
    }
}
